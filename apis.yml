aid: truffle-security
name: Truffle Security
description: >-
  Truffle Security Co. is an open-source security software company founded in 2021 and backed by
  a16z. It builds TruffleHog, the widely adopted secrets-scanning engine that detects, verifies,
  and helps remediate leaked credentials across source code, git history, container images, cloud
  storage, SaaS tools, and CI/CD pipelines. TruffleHog classifies 800+ credential types, actively
  verifies whether a found secret is live, and ships as a Go CLI (open source, AGPL-3.0) plus a
  commercial TruffleHog Enterprise platform with continuous monitoring, 20+ integrations
  (GitHub, GitLab, Confluence, Jira, Slack, SharePoint, GCP, and more), a triage dashboard, and a
  v3 Enterprise API. Products include TruffleHog open source, TruffleHog Enterprise, Analyze, and
  Forager.
